# Hyperparameter Configuration: Deep Sets Baseline (No Edges)
model_type: "deepsets"
model_name: "Deep Sets Baseline"
data_path: "data/sample_jets.npz"

training:
  batch_size: 32
  epochs: 15
  learning_rate: 0.002
  weight_decay: 0.0001
  scheduler_step: 5
  scheduler_gamma: 0.5
  seed: 42

model:
  input_dim: 7
  hidden_dims: [64, 128, 128]
  classifier_dims: [128, 64]
  pooling: "mean_max"
  dropout: 0.1
  num_classes: 2

output:
  checkpoint_dir: "checkpoints"
  checkpoint_filename: "deepsets_best.pt"
  figure_dir: "results/figures"
